# render.conf — ek baar set karo, render.sh ise auto-load karega.
# Sab kuch env var se bhi override ho sakta hai.

# PrismLauncher binary ka path (AppImage ya extracted)
PRISM_BIN="${PRISM_BIN:-$HOME/mc/PrismLauncher}"

# Prism instance ka naam jisme Fabric + ReplayMod + AutoRender mod laga hai
PRISM_INSTANCE="${PRISM_INSTANCE:-ReplayRender}"

# Offline account ka naam (Prism me pehle add kar lena)
PRISM_ACCOUNT="${PRISM_ACCOUNT:-RenderBot}"

# Prism instance ka .minecraft folder. Khaali chhodo to auto-detect hoga.
MC_DIR="${MC_DIR:-}"

# Output folder jahan final video aayega
OUTPUT_DIR="${OUTPUT_DIR:-$HOME/renders}"

# Xvfb display number
XVFB_DISPLAY="${XVFB_DISPLAY:-99}"

# Render done detect karne ki max wait (seconds). 0 = unlimited.
RENDER_TIMEOUT="${RENDER_TIMEOUT:-0}"
