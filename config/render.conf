# render.conf — ek baar set karo, render.sh ise auto-load karega.
# Sab kuch env var se bhi override ho sakta hai.

# Kaunsa launcher: "portablemc" (default, GUI-free, setup.sh isi ko set karta hai)
# ya "prism" (agar tu Prism manually use kar raha ho).
LAUNCHER="${LAUNCHER:-portablemc}"

# ---- portablemc (default) ----
# Instance/game dir jo setup.sh banata hai (mods/, replay_recordings/ yahin rehte hain)
INSTANCE_DIR="${INSTANCE_DIR:-$HOME/mc/render-instance}"
MC_VERSION="${MC_VERSION:-26.1.2}"
LOADER_VERSION="${LOADER_VERSION:-0.19.3}"
MC_USERNAME="${MC_USERNAME:-RenderBot}"     # offline username

# ---- prism (sirf agar LAUNCHER=prism) ----
PRISM_BIN="${PRISM_BIN:-$HOME/mc/PrismLauncher}"
PRISM_INSTANCE="${PRISM_INSTANCE:-ReplayRender}"
PRISM_ACCOUNT="${PRISM_ACCOUNT:-RenderBot}"
MC_DIR="${MC_DIR:-}"                         # khaali = auto-detect

# ---- common ----
OUTPUT_DIR="${OUTPUT_DIR:-$HOME/renders}"    # final video yahan
XVFB_DISPLAY="${XVFB_DISPLAY:-99}"
RENDER_TIMEOUT="${RENDER_TIMEOUT:-0}"        # max wait sec, 0 = unlimited
